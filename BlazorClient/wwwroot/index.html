<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinicVisist.BlazorClient</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css">
    <link href="BlazorClient.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/app.css" />
    <style>
        #app-loading {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

            #app-loading.hidden {
                opacity: 0;
                pointer-events: none;
            }

        .loading-card {
            background: white;
            border-radius: 20px;
            padding: 48px 56px;
            box-shadow: 0 8px 40px rgba(11, 37, 69, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            min-width: 320px;
        }

        .loading-icon-wrapper {
            width: 72px;
            height: 72px;
            background: #134074;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .loading-icon-wrapper svg {
                width: 36px;
                height: 36px;
                fill: none;
                stroke: #f0ebd8;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

        .loading-title {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #0b2545;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .loading-subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #748cab;
            margin: -16px 0 0;
        }

        .loading-bar-track {
            width: 200px;
            height: 4px;
            background: #e8edf2;
            border-radius: 99px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: #134074;
            border-radius: 99px;
            animation: loadingBar 1.6s ease-in-out infinite;
        }

        @keyframes loadingBar {
            0% {
                width: 0%;
                margin-left: 0;
            }

            50% {
                width: 60%;
                margin-left: 20%;
            }

            100% {
                width: 0%;
                margin-left: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- EKRAN ŁADOWANIA -->
    <div id="app-loading">
        <div class="loading-card">
            <div class="loading-icon-wrapper">
                <!-- ikona serca z krzyżem / medyczna -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 21C12 21 3 13.5 3 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-9 13-9 13z" />
                    <line x1="12" y1="8" x2="12" y2="14" />
                    <line x1="9" y1="11" x2="15" y2="11" />
                </svg>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:15px;">
                <h1 class="loading-title">Patient Portal</h1>
                <p class="loading-subtitle">Loading…</p>
            </div>
            <div class="loading-bar-track">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- APLIKACJA BLAZOR -->
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/Blazor-ApexCharts/js/blazor-apexcharts.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js?v=@(typeof(Radzen.Colors).Assembly.GetName().Version)"></script>
    <script>
        Blazor.start().then(() => {
            const loader = document.getElementById('app-loading');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(() => loader.remove(), 400);
            }
        });
    </script>
</body>
</html>
